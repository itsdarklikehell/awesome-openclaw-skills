name: Generate Gource Video

on:
  push:
    branches: [main, master]

jobs:
  gource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gource
        run: sudo apt-get update && sudo apt-get install -y gource ffmpeg

      - name: Generate Gource video (720p)
        run: |
          gource --seconds-per-day 0.5 \
            --auto-skip-seconds 0.1 \
            --multi-sampling -1280x720 \
            --hide filenames \
            --file-idle-time 0 \
            --background 000000 \
            --font-size 24 \
            --title "awesome-openclaw-skills" \
            --stop-at-end \
            --output-ppm-stream - 2>/dev/null |
          ffmpeg -y -f image2pipe -vcodec ppm -i - \
            -b:v 5000k -r 60 -an \
            -vcodec libx264 -preset fast -crf 23 \
            -threads 0 gource.mp4

      - name: Generate Gource video (1080p)
        run: |
          gource --seconds-per-day 0.5 \
            --auto-skip-seconds 0.1 \
            --multi-sampling -1920x1080 \
            --hide filenames \
            --file-idle-time 0 \
            --background 000000 \
            --font-size 24 \
            --title "awesome-openclaw-skills" \
            --stop-at-end \
            --output-ppm-stream - 2>/dev/null |
          ffmpeg -y -f image2pipe -vcodec ppm -i - \
            -b:v 5000k -r 60 -an \
            -vcodec libx264 -preset fast -crf 23 \
            -threads 0 gource-720p.mp4

      - name: Commit Gource video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4 gource-720p.mp4
          git commit -m "Update Gource visualization [skip ci]" || echo "No changes"
          git push
